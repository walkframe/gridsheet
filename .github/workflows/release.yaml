name: release
on:
  push:
    branches:
      - master
      - fix/*

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  upload-engine:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    name: upload engine
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish engine
        run: |
          pnpm install
          pnpm --filter "@gridsheet/engine..." build
          cd packages/engine
          VERSION=$(node -p "require('./package.json').version")
          TAG=$( [[ "$VERSION" == *-* ]] && echo "--tag next" || echo "" )
          pnpm publish --access public --provenance $TAG --no-git-checks || true
      - name: wait for engine on npm
        run: |
          VERSION=$(node -p "require('./packages/engine/package.json').version")
          for i in $(seq 1 30); do
            if npm view "@gridsheet/engine@$VERSION" version 2>/dev/null; then
              echo "engine@$VERSION is available"
              break
            fi
            echo "Waiting for engine@$VERSION... ($i/30)"
            sleep 5
          done

  upload-web:
    needs: upload-engine
    runs-on: ubuntu-latest
    name: upload web
