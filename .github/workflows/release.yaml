name: release
on:
  push:
    branches:
      - master
      - fix/*

# Run releases one at a time. Two runs publishing the same version raced each other
# (one got E409 and its `|| true` hid it). A newer push waits for the running release
# instead of cancelling it, so a publish is never interrupted halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  upload-engine:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    name: upload engine
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish engine
        run: scripts/publish-package.sh engine --wait

  upload-web:
    needs: upload-engine
    runs-on: ubuntu-latest
    name: upload web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish web
        run: scripts/publish-package.sh web --wait

  upload-functions:
    needs: upload-engine
    runs-on: ubuntu-latest
    name: upload functions
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish functions
        run: scripts/publish-package.sh functions

  upload-xlsx:
    needs: upload-engine
    runs-on: ubuntu-latest
    name: upload xlsx
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish xlsx
        run: scripts/publish-package.sh xlsx

  upload-react-core:
    needs: upload-web
    runs-on: ubuntu-latest
    name: upload react-core
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish react-core
        run: scripts/publish-package.sh react-core

  upload-preact-core:
    needs: upload-web
    runs-on: ubuntu-latest
    name: upload preact-core
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish preact-core
        run: scripts/publish-package.sh preact-core --wait

  upload-react-dev:
    needs: upload-web
    runs-on: ubuntu-latest
    name: upload react-dev
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish react-dev
        run: scripts/publish-package.sh react-dev

  upload-vue-core:
    needs: upload-preact-core
    runs-on: ubuntu-latest
    name: upload vue-core
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish vue-core
        run: scripts/publish-package.sh vue-core

  upload-svelte-core:
    needs: upload-preact-core
    runs-on: ubuntu-latest
    name: upload svelte-core
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11
      - name: remove authToken from .npmrc
        run: |
          NPM_RC=$(npm config get userconfig)
          sed -i '/_authToken/d' "$NPM_RC" 2>/dev/null || true
      - name: publish svelte-core
        run: scripts/publish-package.sh svelte-core
